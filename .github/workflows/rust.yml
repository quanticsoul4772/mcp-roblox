name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
  VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
  NEO4J_URI: ${{ secrets.NEO4J_URI }}
  NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
  NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check secrets are set
      run: |
        if [ -z "$ROBLOX_OPEN_CLOUD_API_KEY" ]; then echo "ERROR: ROBLOX_OPEN_CLOUD_API_KEY not set"; exit 1; fi
        if [ -z "$VOYAGE_API_KEY" ]; then echo "ERROR: VOYAGE_API_KEY not set"; exit 1; fi
        if [ -z "$NEO4J_URI" ]; then echo "ERROR: NEO4J_URI not set"; exit 1; fi
        if [ -z "$NEO4J_USERNAME" ]; then echo "ERROR: NEO4J_USERNAME not set"; exit 1; fi
        if [ -z "$NEO4J_PASSWORD" ]; then echo "ERROR: NEO4J_PASSWORD not set"; exit 1; fi
        echo "All secrets are set"
    - name: Build
      run: cargo build --verbose
    - name: Debug env in Rust
      run: |
        cat > /tmp/test_env.rs << 'RUSTCODE'
        fn main() {
            match std::env::var("ROBLOX_OPEN_CLOUD_API_KEY") {
                Ok(v) => println!("ROBLOX_OPEN_CLOUD_API_KEY is set ({} chars)", v.len()),
                Err(e) => println!("ROBLOX_OPEN_CLOUD_API_KEY error: {:?}", e),
            }
        }
        RUSTCODE
        rustc /tmp/test_env.rs -o /tmp/test_env && /tmp/test_env
      env:
        ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
    - name: Run tests
      run: |
        echo "ROBLOX_OPEN_CLOUD_API_KEY length: ${#ROBLOX_OPEN_CLOUD_API_KEY}"
        set -o pipefail
        cargo test --verbose -- --nocapture 2>&1 | head -1000
      env:
        ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
        VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        NEO4J_URI: ${{ secrets.NEO4J_URI }}
        NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
        NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
